services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:-changeme_in_production}
      DATABASE_URL: sqlite:////data/yettidb.sqlite
      SERVER_NAME: ${SERVER_NAME:-localhost}
    volumes:
      - db_data:/data
      - caddy_data:/data/caddy
      - caddy_config:/config/caddy

volumes:
  db_data:
  caddy_data:
  caddy_config:
